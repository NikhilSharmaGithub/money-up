<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Safari on iPhone and iPad turns this into the strip at the top of the
     page with a GET button on it — the shortest path from "someone landed
     here on a phone" to "the app is on their home screen". Every other
     browser ignores it, which is why the page carries its own button too. -->
<meta name="apple-itunes-app" content="app-id=6806881798" />
<title>Get MoneyMove for iPhone</title>
<meta name="description" content="MoneyMove on iPhone and iPad — the same game, the same friends, the same tournaments, on the App Store." />
<link rel="canonical" href="https://www.moneymove.live/app" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MoneyMove" />
<meta property="og:url" content="https://www.moneymove.live/app" />
<meta property="og:title" content="Get MoneyMove for iPhone" />
<meta property="og:description" content="MoneyMove on iPhone and iPad — the same game, the same friends, the same tournaments, on the App Store." />
<meta property="og:image" content="https://www.moneymove.live/og.png" />
<meta name="twitter:card" content="summary_large_image" />

<!-- What shows before the script below has read the table; it then takes
     whatever --page is, the way the game's own tag does. -->
<meta name="theme-color" content="#0c1310" />
<!-- The game's own type, tables and controls. This page used to carry a
     handful of hard-coded hexes and the system font, so it was the green night
     table whatever the player had picked, in a face the game never uses. It
     reads the game's stylesheet now: the fourteen table blocks, Outfit, and
     the controls its two buttons are. The icon is the drawn die the rest of
     the site wears — never an emoji, which is another vendor's drawing and
     different on every platform. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230c1310'/><rect x='7' y='7' width='18' height='18' rx='4' fill='%23f4f1e4'/><g fill='%231c6b45'><circle cx='12' cy='12' r='2'/><circle cx='20' cy='12' r='2'/><circle cx='16' cy='16' r='2'/><circle cx='12' cy='20' r='2'/><circle cx='20' cy='20' r='2'/></g></svg>" />
<link rel="stylesheet" href="/css/style.css" />
<script>
  // Before paint, and read exactly the way the game reads it, so walking from
  // a table to this page keeps the table the player is sitting at — Crimson
  // at night stays Crimson at night — and never flashes the wrong one first.
  (function () {
    var root = document.documentElement;
    function wear() {
      var saved = null, pal = null;
      try {
        saved = localStorage.getItem('moneymove:theme');
        pal = localStorage.getItem('moneymove:palette');
      } catch (e) {}
      // Dark is the house style; the system setting only lightens it.
      var dark = saved ? saved === 'dark'
        : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      if (pal && pal !== 'felt') root.dataset.palette = pal;
      else delete root.dataset.palette;
      // The browser's own chrome wears the page too, read back off the
      // stylesheet the way app.js does it rather than kept in a list here.
      var tag = document.querySelector('meta[name="theme-color"]');
      var page = getComputedStyle(root).getPropertyValue('--page').trim();
      if (tag && page) tag.setAttribute('content', page);
    }
    wear();
    // The switch lives in the game, not on this page. Flip it in the tab the
    // game is in and this one follows; a player who has never touched it
    // follows the system, the way their first visit to the game did.
    window.addEventListener('storage', function (e) {
      if (!e.key || e.key === 'moneymove:theme' || e.key === 'moneymove:palette') wear();
    });
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
    if (mq && mq.addEventListener) mq.addEventListener('change', wear);
  })();
</script>
<style>
  /* Everything here is printed straight onto the table's page, not onto a
     card, so it takes the --page-ink family the landing's wordmark and prose
     take — which is what keeps it readable on crimson by day, the one light
     table whose page is a deep red — through the --doc-* inks the stylesheet
     derives from that family for pages like this one. The browser's own
     widgets and scrollbars follow the table's light or dark. */
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  /* The game is one screen that never scrolls and pins html and body to say
     so; a page that can outgrow a short phone has to be allowed to. */
  html, body { height: auto; overflow: visible; }
  body { color: var(--page-ink);
         min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
  main { max-width: 420px; text-align: center; }
  /* icons.js's own dice, inlined: the page loads no script to paint a
     data-ico, and one glyph does not justify fetching the whole set. */
  .mark { display: block; width: 64px; height: 64px; margin: 0 auto; color: var(--page-accent); }
  h1 { font-size: 26px; margin: 14px 0 6px; }
  /* The stylesheet zeroes every margin for the game's sake; a paragraph gets
     back the spacing it had. */
  p { color: var(--doc-body); font-size: 15px; line-height: 1.6; margin: 1em 0; }
  /* The one primary is a plate in the table's accent with the palette's ink
     on it — the page's own plate, which on crimson by day turns over to the
     page's ink, since there the page is the accent (see --page-plate) — and
     the way out is plain glass — the pair the landing prints as
     Play now over Create a game. The way out is not Clear, though a ghost
     would be on a card: it sits straight on the page, Clear does not adapt,
     and over crimson's red by day its words fall to 4.1:1. The stylesheet
     paints both; this is only their size and place on the page. */
  .btn { display: block; margin: 18px auto 0; padding: 14px 22px; border-radius: var(--r-14);
         font-weight: 800; text-decoration: none; }
  .btn:not(.primary) { font-weight: 600; }
  .fine { color: var(--doc-quiet); font-size: 12.5px; margin-top: 22px; }
  .foot { margin-top: 34px; font-size: 13px; color: var(--doc-quiet); }
  .foot a { color: var(--doc-quiet); }
  .foot a.home { color: var(--doc-accent); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" opacity=".3"
      d="M16.4 3.2h9a3.4 3.4 0 0 1 3.4 3.4v9a3.4 3.4 0 0 1 -3.4 3.4h-9a3.4 3.4 0 0 1 -3.4 -3.4v-9a3.4 3.4 0 0 1 3.4 -3.4ZM16.1 7.8a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0ZM22.7 14.4a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0Z"/>
    <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"
      d="M6.6 13h9a3.4 3.4 0 0 1 3.4 3.4v9a3.4 3.4 0 0 1 -3.4 3.4h-9a3.4 3.4 0 0 1 -3.4 -3.4v-9a3.4 3.4 0 0 1 3.4 -3.4ZM6.2 17.6a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0ZM12.8 17.6a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0ZM6.2 24.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0ZM12.8 24.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0Z"/>
  </svg>
  <h1>MoneyMove</h1>
  <p id="line">Opening the App Store…</p>
  <a class="btn primary on-page" id="primary" href="https://apps.apple.com/app/id6806881798">Get the iPhone app</a>
  <a class="btn" id="secondary" href="/">Play in the browser instead</a>
  <p class="fine" id="fine">The Android build isn’t out yet — on Android the browser version plays the same.</p>
  <p class="foot">
    <a class="home" href="/">Play MoneyMove</a> ·
    <a href="/how-to-play">How to play</a> ·
    <a href="/boards">Boards</a> ·
    <a href="/support">Support</a> ·
    <a href="/privacy">Privacy</a>
  </p>
</main>
<script>
  // Send iPhone and iPad straight to the App Store; everyone else gets the web
  // game, which is the whole thing anyway.
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua)
    || (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1); // iPadOS lies about being a Mac
  var line = document.getElementById('line');
  var primary = document.getElementById('primary');
  var secondary = document.getElementById('secondary');
  if (isIOS) {
    location.replace('https://apps.apple.com/app/id6806881798');
  } else if (/Android/.test(ua)) {
    line.textContent = 'The Android app is on the way. Play in your browser for now — same game, same tables.';
    primary.textContent = 'Play in the browser';
    primary.href = '/';
    // The fallback button now says exactly what the main one says, and the
    // fine print repeats the paragraph above it — drop both.
    secondary.remove();
    document.getElementById('fine').remove();
  } else {
    line.textContent = 'Play right here in the browser, or grab the iPhone app.';
  }
</script>
</body>
</html>
