<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', -apple-system, system-ui, sans-serif; }
    a { color: #A4142A; } a:hover { color: #7D0F20; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1ED; display: flex; flex-direction: column; padding: 14px 18px 24px 18px; box-sizing: border-box; overflow: hidden;">

  <div style="width: 44px; height: 5px; border-radius: 3px; background: #D8CAC3; align-self: center;"></div>

  <!-- header -->
  <div style="display: flex; align-items: center; margin-top: 14px;">
    <div style="font-size: 15px; font-weight: 700; color: #A4142A;">Cancel</div>
    <div style="flex: 1; text-align: center; font-size: 19px; font-weight: 800; color: #1E1A1C;">Trade</div>
    <div style="background: #D92037; border-radius: 999px; padding: 8px 18px; font-size: 15px; font-weight: 800; color: #FFFFFF; box-shadow: 0 4px 10px rgba(217,32,55,0.35);">Send</div>
  </div>

  <!-- who -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #4ADE80; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #FFFFFF; box-shadow: 0 4px 12px rgba(40,6,12,0.18);">N</div>
      <div style="font-size: 13px; font-weight: 800; color: #1E1A1C;">You 🇮🇳</div>
    </div>
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M4 8h14m0 0-3.5-3.5M18 8l-3.5 3.5M20 16H6m0 0 3.5-3.5M6 16l3.5 3.5" stroke="#D92037" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #60A5FA; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #FFFFFF; box-shadow: 0 4px 12px rgba(40,6,12,0.18);">R</div>
      <div style="font-size: 13px; font-weight: 800; color: #1E1A1C;">Ravi</div>
    </div>
  </div>

  <!-- you give -->
  <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; margin-top: 22px; box-shadow: 0 6px 18px rgba(40,6,12,0.1); display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #948890;">YOU GIVE</div>

    <div style="display: flex; align-items: center; gap: 10px; background: #FDECEE; border: 1.5px solid #D92037; border-radius: 13px; padding: 12px 14px;">
      <div style="width: 10px; height: 10px; border-radius: 3px; background: #3EC46D;"></div>
      <div style="flex: 1; font-size: 15px; font-weight: 700; color: #1E1A1C;">Rio 🇧🇷</div>
      <div style="font-size: 13px; font-weight: 700; color: #5F5359;">$60</div>
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #D92037; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 16 16" width="11" height="11" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; border-radius: 13px; padding: 4px 2px;">
      <div style="width: 10px; height: 10px; border-radius: 3px; background: #3EC46D;"></div>
      <div style="flex: 1; font-size: 15px; font-weight: 700; color: #948890;">Salvador 🇧🇷</div>
      <div style="font-size: 13px; font-weight: 700; color: #C9BFB8;">$60</div>
      <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #D8CAC3;"></div>
    </div>

    <div style="height: 1px; background: #E9E0DB;"></div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: column;">
        <div style="font-size: 15px; font-weight: 800; color: #1E1A1C;">Cash</div>
        <div style="font-size: 12px; font-weight: 600; color: #948890;">up to $2,480</div>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; background: #F4EEEA; border-radius: 12px; padding: 4px;">
        <div style="width: 38px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="13" height="13" fill="none"><path d="M3.5 8h9" stroke="#948890" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div style="min-width: 56px; text-align: center; font-size: 16px; font-weight: 900; color: #1E1A1C;">$40</div>
        <div style="width: 38px; height: 34px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(40,6,12,0.12); display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="13" height="13" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="#1E1A1C" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      </div>
    </div>
  </div>

  <!-- you get -->
  <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; margin-top: 14px; box-shadow: 0 6px 18px rgba(40,6,12,0.1); display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #948890;">YOU GET</div>

    <div style="display: flex; align-items: center; gap: 10px; border-radius: 13px; padding: 4px 2px;">
      <div style="width: 10px; height: 10px; border-radius: 3px; background: #4AA3E8;"></div>
      <div style="flex: 1; font-size: 15px; font-weight: 700; color: #948890;">Tel Aviv 🇮🇱</div>
      <div style="font-size: 13px; font-weight: 700; color: #C9BFB8;">$100</div>
      <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #D8CAC3;"></div>
    </div>

    <div style="height: 1px; background: #E9E0DB;"></div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: column;">
        <div style="font-size: 15px; font-weight: 800; color: #1E1A1C;">Cash</div>
        <div style="font-size: 12px; font-weight: 600; color: #948890;">up to $2,460</div>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; background: #F4EEEA; border-radius: 12px; padding: 4px;">
        <div style="width: 38px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="13" height="13" fill="none"><path d="M3.5 8h9" stroke="#948890" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div style="min-width: 56px; text-align: center; font-size: 16px; font-weight: 900; color: #1E1A1C;">$0</div>
        <div style="width: 38px; height: 34px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(40,6,12,0.12); display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="13" height="13" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="#1E1A1C" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      </div>
    </div>
  </div>

  <!-- summary -->
  <div style="margin-top: auto; background: #FDF3E0; border: 1px solid #EAD9B0; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 10px;">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4 7h9m0 0L10 4m3 3-3 3M16 13H7m0 0 3-3m-3 3 3 3" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="flex: 1; font-size: 13px; font-weight: 600; color: #7A5510; line-height: 1.45;">Rio + $40 for nothing back — Ravi's bots weigh offers, so sweeten it if he declines.</div>
  </div>
</div>
</x-dc>
</body>
</html>
