<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', -apple-system, system-ui, sans-serif; }
    a { color: #A4142A; } a:hover { color: #7D0F20; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: linear-gradient(160deg, #B31527, #8E0F1E); display: flex; flex-direction: column; align-items: center; padding: 84px 20px 0 20px; box-sizing: border-box; overflow: hidden;">

  <!-- brand -->
  <div style="font-size: 44px; font-weight: 900; letter-spacing: -1.5px; color: #FFFFFF; line-height: 1;">MONEY<span style="color: #FFD3DA;">MOVE</span></div>
  <div style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.82); margin-top: 10px;">Buy streets. Build hotels. Bankrupt your friends.</div>

  <!-- main card -->
  <div style="width: 100%; background: #FFFFFF; border-radius: 22px; box-shadow: 0 18px 40px rgba(40,6,12,0.32); padding: 20px; box-sizing: border-box; margin-top: 28px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #948890;">NICKNAME</div>
      <div style="background: #F4EEEA; border: 1px solid #E9E0DB; border-radius: 12px; padding: 13px 14px; font-size: 16px; font-weight: 700; color: #1E1A1C;">Nik</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #948890;">FLAG</div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #FDECEE; border: 1.5px solid #D92037; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇮🇳</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇬🇧</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇺🇸</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇧🇷</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇩🇪</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 20px;">🇯🇵</div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #F4EEEA; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #5F5359;">+44</div>
      </div>
    </div>

    <div style="background: linear-gradient(180deg, #E5334A, #D92037); border: 1px solid #A4142A; border-radius: 15px; padding: 16px; text-align: center; font-size: 17px; font-weight: 800; color: #FFFFFF; box-shadow: 0 6px 16px rgba(217,32,55,0.35);">Create a private game</div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1; height: 1px; background: #E9E0DB;"></div>
      <div style="font-size: 12px; font-weight: 600; color: #948890;">or join with a code</div>
      <div style="flex: 1; height: 1px; background: #E9E0DB;"></div>
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; background: #F4EEEA; border: 1px solid #E9E0DB; border-radius: 12px; padding: 13px 14px; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #948890; font-family: ui-monospace, 'SF Mono', monospace; text-align: center;">room code</div>
      <div style="background: #1E1A1C; border-radius: 12px; padding: 13px 22px; font-size: 15px; font-weight: 800; color: #FFFFFF;">Join</div>
    </div>
  </div>

  <!-- friends card -->
  <div style="width: 100%; background: #FFFFFF; border-radius: 22px; box-shadow: 0 18px 40px rgba(40,6,12,0.28); padding: 18px 20px; box-sizing: border-box; margin-top: 14px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #948890;">FRIENDS</div>
      <div style="background: #FDECEE; border: 1px solid #F3C3CA; border-radius: 9px; padding: 5px 12px; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #7D0F20; font-family: ui-monospace, 'SF Mono', monospace;">QMAXNR</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #60A5FA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #FFFFFF;">A</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 14px; font-weight: 700; color: #1E1A1C;">Arjun 🇬🇧</div>
        <div style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; color: #B7791F;">IN A LOBBY</div>
      </div>
      <div style="background: #D92037; border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 800; color: #FFFFFF;">Join</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #F472B6; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #FFFFFF;">P</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 14px; font-weight: 700; color: #1E1A1C;">Priya</div>
        <div style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; color: #948890;">OFFLINE</div>
      </div>
    </div>
  </div>

  <div style="font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,0.55); margin-top: auto; margin-bottom: 26px; text-align: center; line-height: 1.5;">An original implementation of the classic<br>property-trading board game.</div>
</div>
</x-dc>
</body>
</html>
