<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', -apple-system, system-ui, sans-serif; }
    a { color: #A4142A; } a:hover { color: #7D0F20; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: linear-gradient(160deg, #B31527, #8E0F1E); position: relative; overflow: hidden;">

  <!-- dimmed game behind the sheet -->
  <div style="position: absolute; top: 60px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; opacity: 0.45;">
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF;"></div>
    <div style="background: #FFFFFF; border-radius: 999px; padding: 8px 15px; font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #1E1A1C; font-family: ui-monospace, 'SF Mono', monospace;">yxgd9</div>
  </div>

  <!-- sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 130px; background: #F6F1ED; border-radius: 26px 26px 0 0; box-shadow: 0 -14px 40px rgba(40,6,12,0.35); display: flex; flex-direction: column; padding: 10px 18px 20px 18px; box-sizing: border-box;">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #D8CAC3; align-self: center;"></div>
    <div style="font-size: 19px; font-weight: 800; color: #1E1A1C; text-align: center; margin-top: 14px;">Chat</div>

    <!-- segmented -->
    <div style="display: flex; background: #EBE3DD; border-radius: 12px; padding: 3px; margin-top: 14px;">
      <div style="flex: 1; background: #FFFFFF; border-radius: 10px; padding: 9px; text-align: center; font-size: 14px; font-weight: 800; color: #1E1A1C; box-shadow: 0 2px 6px rgba(40,6,12,0.12);">Chat</div>
      <div style="flex: 1; padding: 9px; text-align: center; font-size: 14px; font-weight: 700; color: #948890;">Log</div>
    </div>

    <!-- messages -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
      <div style="display: flex; gap: 9px; align-items: flex-end;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: #4ADE80; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #FFFFFF; flex-shrink: 0;">N</div>
        <div style="background: #FFFFFF; border-radius: 16px 16px 16px 5px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(40,6,12,0.08); max-width: 250px;">
          <div style="font-size: 11px; font-weight: 800; color: #157F4A;">Nik 🇮🇳</div>
          <div style="font-size: 14.5px; font-weight: 600; color: #1E1A1C; margin-top: 2px;">Good luck Ravi 🎲</div>
        </div>
      </div>
      <div style="display: flex; gap: 9px; align-items: flex-end; flex-direction: row-reverse;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: #60A5FA; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #FFFFFF; flex-shrink: 0;">R</div>
        <div style="background: #FDECEE; border-radius: 16px 16px 5px 16px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(40,6,12,0.08); max-width: 250px;">
          <div style="font-size: 11px; font-weight: 800; color: #3A6BC4;">Ravi</div>
          <div style="font-size: 14.5px; font-weight: 600; color: #1E1A1C; margin-top: 2px;">You'll need it more than me 😏</div>
        </div>
      </div>
      <div style="display: flex; gap: 9px; align-items: flex-end;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: #4ADE80; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #FFFFFF; flex-shrink: 0;">N</div>
        <div style="background: #FFFFFF; border-radius: 16px 16px 16px 5px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(40,6,12,0.08);">
          <div style="font-size: 22px; line-height: 1;">🔥</div>
        </div>
      </div>
    </div>

    <!-- emote row -->
    <div style="display: flex; gap: 7px; margin-bottom: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">👍</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">😂</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">😱</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">🔥</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">💸</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">🎲</div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(40,6,12,0.1); display: flex; align-items: center; justify-content: center; font-size: 19px;">🤝</div>
    </div>

    <!-- input -->
    <div style="display: flex; gap: 9px; align-items: center;">
      <div style="flex: 1; background: #FFFFFF; border: 1px solid #E9E0DB; border-radius: 999px; padding: 13px 18px; font-size: 15px; font-weight: 600; color: #948890;">Say something…</div>
      <div style="width: 46px; height: 46px; border-radius: 50%; background: #D92037; box-shadow: 0 4px 12px rgba(217,32,55,0.4); display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M3 10 17 3l-3.5 14-4-5.5zM9.5 11.5 17 3" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
